services:
  # 1. Слой Базы Данных (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: qa_postgres
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password123
      POSTGRES_DB: ecom_test_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d ecom_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Слой Кэша и Сессий (Redis)
  redis_cache:
    image: redis:7-alpine
    container_name: qa_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Слой Брокера Сообщений (RabbitMQ)
  rabbitmq_broker:
    image: rabbitmq:3-management-alpine
    container_name: qa_rabbitmq
    ports:
      - "5672:5672"   # Порт для пересылки сообщений кодом
      - "15672:15672" # Порт для красивой веб-панели управления
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
