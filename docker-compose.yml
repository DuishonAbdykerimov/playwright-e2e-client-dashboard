services:
  # 1. Слой Базы Данных (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: qa_postgres
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password123
      POSTGRES_DB: ecom_test_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d ecom_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Слой Кэша и Сессий (Redis)
  redis_cache:
    image: redis:7-alpine
    container_name: qa_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Слой Брокера Сообщений (RabbitMQ)
  rabbitmq_broker:
    image: rabbitmq:3-management-alpine
    container_name: qa_rabbitmq
    ports:
      - "5672:5672"   # Порт для пересылки сообщений кодом
      - "15672:15672" # Порт для красивой веб-панели управления
      - "15692:15692" # <<< ДОБАВЛЯЕМ ЭТОТ ПОРТ ДЛЯ СБОРА МЕТРИК
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ECOM_USER_EMAIL: ${ECOM_USER_EMAIL:-}
      ECOM_USER_PASSWORD: ${ECOM_USER_PASSWORD:-}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password123
      POSTGRES_DB: ecom_test_db
      K8S_POSTGRES_SKIP: "true"
      REDIS_URL: redis://redis_cache:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq_broker:5672
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq_broker:
        condition: service_healthy
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./allure-results:/app/allure-results
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: qa_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090" # Порт админки Prometheus
    deploy:
      resources:
        limits:
          memory: 256M # Жесткий лимит памяти!

  grafana:
    image: grafana/grafana-oss:10.0.0
    container_name: qa_grafana
    ports:
      - "3000:3000" # Порт веб-интерфейса Графаны
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль для входа в Графану
    deploy:
      resources:
        limits:
          memory: 512M # Жесткий лимит памяти!
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: qa_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m" # Ограничиваем аппетит Java внутри Эластика
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          memory: 512M # Жесткий потолок для Mac!

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: qa_kibana
    ports:
      - "5601:5601" # Порт веб-интерфейса Кибаны
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 512M # Жесткий потолок для Mac!



volumes:
  pgdata:
