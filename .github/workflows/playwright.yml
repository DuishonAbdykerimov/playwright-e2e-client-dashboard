name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECOM_USER_EMAIL: ${{ secrets.ECOM_USER_EMAIL }}
      ECOM_USER_PASSWORD: ${{ secrets.ECOM_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests in Docker
        run: docker compose --profile test run --build --rm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            allure-results/
          retention-days: 30
      - name: Stop test infrastructure
        if: ${{ always() }}
        run: docker compose down --volumes
